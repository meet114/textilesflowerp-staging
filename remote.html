<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">i-SENSE Remote View</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #FFFFFF;
      user-select: none;
    }

    /* ─── Top Header Bar ─── */
    .top-header-bar {
      width: 100%;
      height: 44px;
      background-color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #1E293B;
      z-index: 100;
      position: relative;
    }
    .top-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .top-header-left img.logo {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
    .brand-remote-title {
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.2px;
    }
    .status-indicator {
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    .status-indicator.connected {
      color: #10B981;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-indicator.connecting {
      color: #F59E0B;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .status-indicator.offline {
      color: #EF4444;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .top-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-action-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #CBD5E1;
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .header-action-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* ─── Main Viewport Area ─── */
    .main-viewport {
      width: 100%;
      height: calc(100vh - 44px);
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Authentic noVNC Screen Container */
    #screenContainer {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }
    #screenContainer > div {
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    #screenContainer canvas {
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: contain !important;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.85);
      border-radius: 2px;
    }

    /* ─── Authentic Connecting to Remote View Screen ─── */
    .connecting-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.35s ease;
    }
    .remote-view-card {
      background: radial-gradient(120% 120% at 50% 20%, #1E293B 0%, #0F172A 100%);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 16px;
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(37, 99, 235, 0.12);
      max-width: 440px;
      width: 90%;
      text-align: center;
    }
    .pulse-ring-container {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .spinner-ring {
      position: absolute;
      width: 76px;
      height: 76px;
      border: 3.5px solid rgba(37, 99, 235, 0.15);
      border-top-color: #3B82F6;
      border-right-color: #60A5FA;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .pulse-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.18);
      color: #60A5FA;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .connecting-title {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.2px;
      margin-bottom: 6px;
    }
    .connecting-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #94A3B8;
      margin-bottom: 22px;
    }
    .connecting-meter-bar {
      width: 100%;
      height: 4px;
      background: #1E293B;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }
    .connecting-meter-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #2563EB, #60A5FA);
      border-radius: 2px;
      animation: meterSlide 1.6s ease-in-out infinite;
    }
    @keyframes meterSlide {
      0% { left: -35%; width: 35%; }
      50% { width: 50%; }
      100% { left: 100%; width: 35%; }
    }
    .connecting-status-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 600;
      color: #CBD5E1;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #F59E0B;
      animation: pulseDot 1.2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 1; }
    }
    .retry-btn {
      margin-top: 18px;
      background: #2563EB;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    .retry-btn:hover {
      background: #1D4ED8;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.6);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- ─── Top Header Bar ─── -->
  <header class="top-header-bar">
    <div class="top-header-left">
      <img src="favicon.png" alt="iSENSE" class="logo" onerror="this.src='logo.png';">
      <span class="brand-remote-title">i-SENSE Remote: M<span id="headerMachNo">01</span></span>
      <span id="statusBadge" class="status-indicator connecting">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <span id="statusBadgeText">Connecting to Remote View...</span>
      </span>
    </div>
    <div class="top-header-right">
      <button class="header-action-btn" onclick="toggleFullScreen()" title="Full Screen">
        <i class="fa-solid fa-expand"></i> <span>Full Screen</span>
      </button>
      <button class="header-action-btn" onclick="reconnect()" title="Refresh / Reconnect">
        <i class="fa-solid fa-rotate"></i> <span>Reconnect</span>
      </button>
    </div>
  </header>

  <!-- ─── Main Viewport Area ─── -->
  <main class="main-viewport" id="viewport">
    <!-- Authentic noVNC Screen Canvas Container -->
    <div id="screenContainer"></div>

    <!-- Authentic Connecting to Remote View Screen (No fake pictures, pure live connection state) -->
    <div id="connectingScreen" class="connecting-screen">
      <div class="remote-view-card">
        <div class="pulse-ring-container">
          <div class="spinner-ring"></div>
          <div class="pulse-icon">
            <i class="fa-solid fa-desktop"></i>
          </div>
        </div>
        <div class="connecting-title" id="connectingTitle">Connecting to Remote View...</div>
        <div class="connecting-subtitle" id="connectingSubtitle">Establishing secure live stream for Loom M<span id="loadingMachNo">01</span>...</div>
        <div class="connecting-meter-bar">
          <div class="connecting-meter-fill"></div>
        </div>
        <div class="connecting-status-chip">
          <span class="status-dot"></span>
          <span id="connectingStatusDetail">Waiting for live video stream from gateway...</span>
        </div>
        <button id="manualReconnectBtn" class="retry-btn" style="display:none;" onclick="reconnect()">
          <i class="fa-solid fa-rotate"></i> <span>Retry Connection</span>
        </button>
      </div>
    </div>
  </main>

  <script type="module">
    // ─── Import Official noVNC ES Module ───
    import RFB from 'https://cdn.jsdelivr.net/gh/novnc/noVNC@v1.5.0/core/rfb.js';

    // ─── Cryptographic Token Obfuscation System ───
    // Protects internal machine IP, ports, and company ID from URL exposure
    const SECRET_KEY = 'iSENSE@TextilesFlow2026#Stream';

    function decodeRemoteToken(token) {
      try {
        let base64 = token.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) {
          base64 += '=';
        }
        const binaryStr = atob(base64);
        const keyBytes = [];
        for (let i = 0; i < SECRET_KEY.length; i++) {
          keyBytes.push(SECRET_KEY.charCodeAt(i));
        }
        const bytes = [];
        for (let i = 0; i < binaryStr.length; i++) {
          bytes.push(binaryStr.charCodeAt(i) ^ keyBytes[i % keyBytes.length]);
        }
        const decoder = new TextDecoder('utf-8');
        const jsonStr = decoder.decode(new Uint8Array(bytes));
        return JSON.parse(jsonStr);
      } catch (e) {
        console.warn('[i-SENSE Remote] Token parse warning:', e);
        return null;
      }
    }

    function encodeRemoteToken(params) {
      try {
        const payload = {
          m: String(params.machine || params.m || '1').replace(/\D/g, '') || '1',
          c: params.company || params.c || '',
          h: params.host || params.h || '',
          p: Number(params.port || params.p || 5900),
          x: (params.control === true || params.control === 'true' || params.x === 1) ? 1 : 0,
          e: (params.embed === true || params.embed === 'true' || params.e === 1) ? 1 : 0,
          t: Math.floor(Date.now() / 1000),
        };
        const jsonStr = JSON.stringify(payload);
        const encoder = new TextEncoder();
        const utf8Bytes = encoder.encode(jsonStr);
        const keyBytes = [];
        for (let i = 0; i < SECRET_KEY.length; i++) {
          keyBytes.push(SECRET_KEY.charCodeAt(i));
        }
        let binary = '';
        for (let i = 0; i < utf8Bytes.length; i++) {
          binary += String.fromCharCode(utf8Bytes[i] ^ keyBytes[i % keyBytes.length]);
        }
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      } catch (e) {
        return '';
      }
    }

    // ─── Extract Parameters (Token or Legacy Fallback) ───
    const urlParams = new URLSearchParams(window.location.search);
    const tokenParam = urlParams.get('v') || urlParams.get('token') || urlParams.get('session') || urlParams.get('key');

    let machNum = 1;
    let companyId = '';
    let targetHost = '';
    let targetPort = 5900;
    let canControl = true;
    let isEmbed = false;

    if (tokenParam) {
      const decoded = decodeRemoteToken(tokenParam);
      if (decoded) {
        machNum = parseInt(String(decoded.m || '1').replace(/\D/g, ''), 10) || 1;
        companyId = decoded.c || '';
        targetHost = decoded.h || '';
        targetPort = Number(decoded.p || 5900);
        canControl = decoded.x !== 0;
        isEmbed = decoded.e === 1;
      }
    } else {
      // Legacy plaintext parameters fallback
      const rawMach = urlParams.get('machine') || urlParams.get('loom') || urlParams.get('m') || '1';
      machNum = parseInt(rawMach.replace(/\D/g, ''), 10) || 1;
      companyId = urlParams.get('companyId') || urlParams.get('company') || '';
      targetHost = urlParams.get('host') || urlParams.get('ip') || '';
      targetPort = parseInt(urlParams.get('port') || '5900', 10) || 5900;
      canControl = urlParams.get('control') !== 'false';
      isEmbed = urlParams.get('embed') === 'true';

      // Immediately replace address bar with obfuscated token URL so raw internal parameters are never exposed
      const generatedToken = encodeRemoteToken({
        machine: machNum,
        company: companyId,
        host: targetHost,
        port: targetPort,
        control: canControl,
        embed: isEmbed
      });
      if (generatedToken && window.history && window.history.replaceState) {
        const cleanUrl = window.location.pathname + '?v=' + generatedToken;
        window.history.replaceState({}, document.title, cleanUrl);
      }
    }

    const formattedMach = (machNum < 10 ? '0' : '') + machNum;

    if (isEmbed) {
      const hdr = document.querySelector('.top-header-bar');
      const vp = document.getElementById('viewport');
      if (hdr) hdr.style.display = 'none';
      if (vp) vp.style.height = '100vh';
    }

    // Update UI Titles
    document.title = `i-SENSE Remote - M${formattedMach}`;
    document.getElementById('headerMachNo').innerText = formattedMach;
    document.getElementById('loadingMachNo').innerText = formattedMach;

    const statusBadge = document.getElementById('statusBadge');
    const statusBadgeText = document.getElementById('statusBadgeText');
    const screenContainer = document.getElementById('screenContainer');
    const connectingScreen = document.getElementById('connectingScreen');
    const connectingTitle = document.getElementById('connectingTitle');
    const connectingSubtitle = document.getElementById('connectingSubtitle');
    const connectingStatusDetail = document.getElementById('connectingStatusDetail');
    const manualReconnectBtn = document.getElementById('manualReconnectBtn');

    let rfb = null;
    let reconnectTimeout = null;
    let isVncStreaming = false;

    // ─── Build WebSocket URL for Cloud VNC Reverse Tunnel ───
    function getWsUrl() {
      const isHttps = window.location.protocol === 'https:';
      const wsProto = isHttps ? 'wss:' : 'ws:';
      const host = window.location.host || 'myfocushub.com';
      const compParam = companyId ? `&companyId=${encodeURIComponent(companyId)}` : '';
      const ipParam = targetHost ? `&ip=${encodeURIComponent(targetHost)}` : '';
      const portParam = (targetPort && targetPort !== 5900) ? `&port=${encodeURIComponent(targetPort)}` : '';
      return `${wsProto}//${host}/api/vnc-tunnel?role=viewer&loom=${machNum}${ipParam}${compParam}${portParam}`;
    }

    // ─── Establish Authentic RFB Live Stream Connection ───
    function connectRfb() {
      if (reconnectTimeout) {
        clearTimeout(reconnectTimeout);
        reconnectTimeout = null;
      }

      if (rfb) {
        try { rfb.disconnect(); } catch (_) {}
        rfb = null;
      }
      screenContainer.innerHTML = '';

      // Show Connecting to Remote View state
      connectingScreen.style.display = 'flex';
      connectingScreen.style.opacity = '1';
      connectingTitle.innerText = 'Connecting to Remote View...';
      connectingSubtitle.innerText = `Establishing secure live stream for Loom M${formattedMach}...`;
      connectingStatusDetail.innerText = 'Waiting for live video stream from gateway...';
      manualReconnectBtn.style.display = 'none';

      statusBadge.className = 'status-indicator connecting';
      statusBadge.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Connecting to Remote View...</span>';

      const wsUrl = getWsUrl();
      console.log(`[i-SENSE Remote] Connecting RFB to ${wsUrl}...`);

      try {
        rfb = new RFB(screenContainer, wsUrl, {
          credentials: { password: '11111111' },
          shared: true,
          wsProtocols: ['binary']
        });

        rfb.scaleViewport = true;
        rfb.resizeSession = false;
        rfb.viewOnly = !canControl;

        rfb.addEventListener('credentialsrequired', () => {
          rfb.sendCredentials({ password: '11111111' });
        });

        rfb.addEventListener('connect', () => {
          console.log('[i-SENSE Remote] Live stream connected successfully!');
          isVncStreaming = true;
          statusBadge.className = 'status-indicator connected';
          statusBadge.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>Connected (${canControl ? 'Control' : 'View Only'})</span>`;
          
          connectingScreen.style.opacity = '0';
          setTimeout(() => {
            if (isVncStreaming) connectingScreen.style.display = 'none';
          }, 350);
        });

        rfb.addEventListener('disconnect', (e) => {
          isVncStreaming = false;
          statusBadge.className = 'status-indicator connecting';
          statusBadge.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Reconnecting...</span>';

          connectingScreen.style.display = 'flex';
          connectingScreen.style.opacity = '1';
          connectingTitle.innerText = 'Connecting to Remote View...';
          connectingSubtitle.innerText = `Reconnecting live stream for Loom M${formattedMach}...`;
          connectingStatusDetail.innerText = 'Signal paused • Auto-reconnecting in 3s...';
          manualReconnectBtn.style.display = 'inline-flex';

          reconnectTimeout = setTimeout(connectRfb, 3000);
        });

        rfb.addEventListener('securityfailure', (e) => {
          statusBadge.className = 'status-indicator offline';
          statusBadge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> <span>Auth Error</span>';
          connectingTitle.innerText = 'Security Verification Failed';
          connectingSubtitle.innerText = 'Unable to authenticate session. Please retry or verify gateway connection.';
          connectingStatusDetail.innerText = 'Authentication rejected by remote terminal.';
          manualReconnectBtn.style.display = 'inline-flex';
        });

      } catch (err) {
        console.error('[i-SENSE Remote] RFB Initialization error:', err);
        statusBadge.className = 'status-indicator connecting';
        statusBadge.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Reconnecting...</span>';
        manualReconnectBtn.style.display = 'inline-flex';
        reconnectTimeout = setTimeout(connectRfb, 3000);
      }
    }

    window.reconnect = function() {
      connectRfb();
    };

    window.toggleFullScreen = function() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    };

    connectRfb();
  </script>
</body>
</html>
