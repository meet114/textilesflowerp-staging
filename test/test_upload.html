<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Upload</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { border: 1px solid #ccc; padding: 20px; max-width: 400px; }
        .result { margin-top: 15px; padding: 10px; border: 1px solid #ddd; background: #f9f9f9; display: none; word-break: break-all; }
        .error { color: red; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Test File Upload to API</h2>
        <form id="uploadForm">
            <input type="file" id="fileInput" name="file" required />
            <br><br>
            <button type="submit">Upload</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');
            
            if (fileInput.files.length === 0) {
                alert("Please select a file first.");
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = 'Uploading...';
            resultDiv.className = 'result';

            try {
                // Change the port if your API runs on a different port
                const response = await fetch('http://localhost:3000/api/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<strong>Success!</strong><br>File URL: <a href="http://localhost:3000${data.url}" target="_blank">${data.url}</a>`;
                    resultDiv.style.borderColor = 'green';
                } else {
                    const errText = await response.text();
                    resultDiv.innerHTML = `<strong>Error:</strong> ${response.status} - ${errText}`;
                    resultDiv.className = 'result error';
                }
            } catch (error) {
                resultDiv.innerHTML = `<strong>Network Error:</strong> ${error.message}`;
                resultDiv.className = 'result error';
            }
        });
    </script>
</body>
</html>
