<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="TextilesFlow ERP - Comprehensive Cloud ERP for Textile Manufacturers">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TextilesFlowErp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TextilesFlowErp</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect & Load Google Fonts (Gujarati, Hindi, English) & Material Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Gujarati:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Hind+Vadodara:wght@400;500;600;700&family=Baloo+Bhai+2:wght@400;600;700;800&family=Roboto+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round|Material+Icons+Sharp" rel="stylesheet">


  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #loading-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      user-select: none;
      transition: opacity 0.4s ease-out;
    }
    .brand-logo-container {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.7);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      position: relative;
    }
    .brand-logo-img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .brand-title .t-red { color: #ef4444; }
    .brand-title .t-blue { color: #38bdf8; }
    .brand-title .t-badge {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 1px;
      margin-left: 2px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 4px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="brand-logo-container">
      <img src="assets/images/logo.png" onerror="this.src='favicon.png'; this.onerror=null;" class="brand-logo-img" alt="Logo" />
    </div>
    <div class="brand-title">
      <span class="t-red">Textiles</span><span class="t-blue">Flow</span><span class="t-badge">ERP</span>
    </div>
    <div class="spinner"></div>
  </div>

  <script>
    // 1. Force unregister any existing service workers & delete CacheStorage immediately
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var reg of registrations) {
          reg.unregister();
          console.log('[Cache Buster] ServiceWorker unregistered.');
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var name of names) {
          caches.delete(name);
          console.log('[Cache Buster] Cache deleted: ' + name);
        }
      });
    }

    // 2. Remove splash once flutter starts rendering
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() { splash.remove(); }, 400);
      }
    });

    window.saveToGooglePasswordManager = function(username, password) {
      if (!username || !password) return;
      try {
        if (window.PasswordCredential && navigator.credentials && navigator.credentials.store) {
          var cred = new PasswordCredential({
            id: username,
            password: password,
            name: username
          });
          navigator.credentials.store(cred).then(function() {
            console.log('[Google Password Manager] Credentials saved successfully.');
          }).catch(function(e) {
            console.warn('[Google Password Manager] Credentials store warning:', e);
          });
        }
      } catch (e) {
        console.warn('[Google Password Manager] API warning:', e);
      }

      try {
        var form = document.getElementById('gpm_autofill_form');
        if (!form) {
          form = document.createElement('form');
          form.id = 'gpm_autofill_form';
          form.action = 'javascript:void(0);';
          form.method = 'post';
          form.style.position = 'absolute';
          form.style.top = '-9999px';
          form.style.left = '-9999px';
          form.style.opacity = '0';
          form.style.pointerEvents = 'none';

          var uInput = document.createElement('input');
          uInput.type = 'text';
          uInput.name = 'username';
          uInput.id = 'gpm_username';
          uInput.autocomplete = 'username email';
          form.appendChild(uInput);

          var pInput = document.createElement('input');
          pInput.type = 'password';
          pInput.name = 'password';
          pInput.id = 'gpm_password';
          pInput.autocomplete = 'current-password';
          form.appendChild(pInput);

          var submitBtn = document.createElement('button');
          submitBtn.type = 'submit';
          submitBtn.id = 'gpm_submit';
          form.appendChild(submitBtn);

          document.body.appendChild(form);
        }

        var userInput = document.getElementById('gpm_username');
        var passInput = document.getElementById('gpm_password');
        if (userInput && passInput) {
          userInput.value = username;
          passInput.value = password;
          form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
        }
      } catch (e) {
        console.warn('[Google Password Manager] Form dispatch warning:', e);
      }
    };

    // 🔔 Real-Time Loom Desktop System Notification (Chrome/Edge/Firefox)
    window.showWebNotification = function(title, body, iconUrl) {
      try {
        if (!("Notification" in window)) return;
        var options = {
          body: body || '',
          icon: iconUrl || 'favicon.png',
          badge: 'favicon.png',
          vibrate: [200, 100, 200],
          requireInteraction: false
        };
        if (Notification.permission === "granted") {
          new Notification(title, options);
        } else if (Notification.permission !== "denied") {
          Notification.requestPermission().then(function(permission) {
            if (permission === "granted") {
              new Notification(title, options);
            }
          });
        }
      } catch (err) {
        console.warn('[Web Notification Error]:', err);
      }
    };
  </script>

  <script>
    var flutterBootScript = document.createElement('script');
    flutterBootScript.src = "flutter_bootstrap.js?v=" + new Date().getTime();
    flutterBootScript.async = true;
    document.body.appendChild(flutterBootScript);
  </script>
</body>
</html>
