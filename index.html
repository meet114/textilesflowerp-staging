  <!-- Immediate URL Sanitization & Seamless SSO Session Transfer -->
  <script>
    try {
      let email = null;
      let pass = null;

      // 1. From Search Query (e.g. ?email=...&password=...)
      if (window.location.search && (window.location.search.includes('email=') || window.location.search.includes('password='))) {
        const urlParams = new URLSearchParams(window.location.search);
        email = urlParams.get('email');
        pass = urlParams.get('password');
      }

      // 2. From Hash (e.g. #/?email=... or #email=...)
      if (!email && window.location.hash && window.location.hash.includes('email=')) {
        const hashStr = window.location.hash;
        const qIdx = hashStr.indexOf('?');
        if (qIdx !== -1) {
          const hashParams = new URLSearchParams(hashStr.substring(qIdx));
          email = hashParams.get('email');
          pass = hashParams.get('password');
        }
      }

      // 3. From Session Storage (set by website portal modal)
      if (!email) {
        email = sessionStorage.getItem('portal_sso_email');
        pass = sessionStorage.getItem('portal_sso_pass');
      }

      if (email) {
        email = email.trim().replace(/^"+|"+$/g, '');
        if (pass) pass = pass.trim().replace(/^"+|"+$/g, '');

        localStorage.setItem('flutter.saved_login_email', JSON.stringify(email));
        localStorage.setItem('saved_login_email', email);
        localStorage.setItem('flutter.app_local_logged_in_email', JSON.stringify(email));
        localStorage.setItem('app_local_logged_in_email', email);

        if (pass) {
          localStorage.setItem('flutter.saved_login_password', JSON.stringify(pass));
          localStorage.setItem('saved_login_password', pass);
        }
        localStorage.setItem('flutter.remember_login_credentials', true);
        localStorage.setItem('remember_login_credentials', 'true');

        // Clean up one-time session storage
        try {
          sessionStorage.removeItem('portal_sso_email');
          sessionStorage.removeItem('portal_sso_pass');
        } catch (_) {}

        // Allow Flutter Web engine 5s to boot before removing query params from URL bar
        setTimeout(() => {
          try {
            const cleanUrl = window.location.origin + window.location.pathname + (window.location.hash ? window.location.hash.split('?')[0] : '');
            window.history.replaceState({}, document.title, cleanUrl);
          } catch (_) {}
        }, 5000);
      }
    } catch (_) {}

  </script>

  <script>
    // 1. Force unregister any existing service workers & delete CacheStorage immediately
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var reg of registrations) {
          reg.unregister();
          console.log('[Cache Buster] ServiceWorker unregistered.');
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var name of names) {
          caches.delete(name);
          console.log('[Cache Buster] Cache deleted: ' + name);
        }
      });
    }

    // 2. Remove splash once flutter starts rendering (with MutationObserver & fallback timer)
    function hideLoadingSplash() {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', hideLoadingSplash);

    var splashObserver = new MutationObserver(function(mutations, observer) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('flt-scene-host')) {
        setTimeout(hideLoadingSplash, 500);
        observer.disconnect();
      }
    });
    try {
      splashObserver.observe(document.body, { childList: true, subtree: true });
    } catch (_) {}
    setTimeout(hideLoadingSplash, 3500);

    window.saveToGooglePasswordManager = function(username, password) {
      if (!username || !password) return;
      try {
        localStorage.setItem('saved_login_email', username);
        localStorage.setItem('saved_login_password', password);
        localStorage.setItem('remember_login_credentials', 'true');
      } catch (_) {}
      try {
        if (window.PasswordCredential && navigator.credentials && navigator.credentials.store) {
          var cred = new PasswordCredential({
            id: username,
            password: password,
            name: username
          });
          navigator.credentials.store(cred).then(function() {
            console.log('[Google Password Manager] Credentials saved successfully.');
          }).catch(function(e) {
            console.warn('[Google Password Manager] Credentials store warning:', e);
          });
        }
      } catch (e) {
        console.warn('[Google Password Manager] API warning:', e);
      }

      try {
        var form = document.getElementById('gpm_autofill_form');
        if (!form) {
          form = document.createElement('form');
          form.id = 'gpm_autofill_form';
          form.action = 'javascript:void(0);';
          form.method = 'post';
          form.style.position = 'absolute';
          form.style.top = '-9999px';
          form.style.left = '-9999px';
          form.style.opacity = '0';
          form.style.pointerEvents = 'none';

          var uInput = document.createElement('input');
          uInput.type = 'text';
          uInput.name = 'username';
          uInput.id = 'gpm_username';
          uInput.autocomplete = 'username email';
          form.appendChild(uInput);

          var pInput = document.createElement('input');
          pInput.type = 'password';
          pInput.name = 'password';
          pInput.id = 'gpm_password';
          pInput.autocomplete = 'current-password';
          form.appendChild(pInput);

          var submitBtn = document.createElement('button');
          submitBtn.type = 'submit';
          submitBtn.id = 'gpm_submit';
          form.appendChild(submitBtn);

          document.body.appendChild(form);
        }

        var userInput = document.getElementById('gpm_username');
        var passInput = document.getElementById('gpm_password');
        if (userInput && passInput) {
          userInput.value = username;
          passInput.value = password;
          form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
        }
      } catch (e) {
        console.warn('[Google Password Manager] Form dispatch warning:', e);
      }
    };

    // 🔔 Real-Time Loom Desktop System Notification (Chrome/Edge/Firefox)
    window.showWebNotification = function(title, body, iconUrl) {
      try {
        if (!("Notification" in window)) return;
        var options = {
          body: body || '',
          icon: iconUrl || 'favicon.png',
          badge: 'favicon.png',
          vibrate: [200, 100, 200],
          requireInteraction: false
        };
        if (Notification.permission === "granted") {
          new Notification(title, options);
        } else if (Notification.permission !== "denied") {
          Notification.requestPermission().then(function(permission) {
            if (permission === "granted") {
              new Notification(title, options);
            }
          });
        }
      } catch (err) {
        console.warn('[Web Notification Error]:', err);
      }
    };

    // 🛡️ TextilesFlow Anti-Screen Capture & Anti-Inspection Security Mode
    // Super Admin / SaaS Owners are 100% EXEMPT (can freely capture screenshots, record, inspect).
    // All normal users (mill owners, operators, accountants) have screen capture, inspect, and shortcuts blocked.
    window.isTextilesSecurityProtected = false;

    window.setTextilesSecurityMode = function(protect) {
      window.isTextilesSecurityProtected = !!protect;
      console.log('[Security] TextilesFlow Screen Protection:', window.isTextilesSecurityProtected ? 'ACTIVE (Restricted)' : 'INACTIVE (SaaS Owner Allowed)');
    };

    // Instant Blackout Shield against Snipping Tool (Win+Shift+S) and External Screen Grabbers
    var securityShield = null;
    function getOrCreateShield() {
      if (!securityShield) {
        securityShield = document.createElement('div');
        securityShield.id = 'tfSecurityShield';
        securityShield.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000000;z-index:2147483647;display:none;justify-content:center;align-items:center;color:#ffffff;font-family:sans-serif;pointer-events:none;';
        securityShield.innerHTML = '<div style="text-align:center;"><div style="font-size:42px;margin-bottom:8px;">🔒</div><div style="font-weight:700;font-size:16px;letter-spacing:0.5px;">TextilesFlow ERP &bull; Protected Screen</div><div style="font-size:12px;opacity:0.6;margin-top:4px;">Screen capture, recording &amp; switching restricted</div></div>';
        if (document.body) document.body.appendChild(securityShield);
      }
      return securityShield;
    }

    window.addEventListener('blur', function() {
      if (window.isTextilesSecurityProtected) {
        var shield = getOrCreateShield();
        if (shield) shield.style.display = 'flex';
      }
    });

    window.addEventListener('focus', function() {
      var shield = document.getElementById('tfSecurityShield');
      if (shield) shield.style.display = 'none';
    });

    document.addEventListener('visibilitychange', function() {
      var shield = getOrCreateShield();
      if (document.hidden && window.isTextilesSecurityProtected) {
        if (shield) shield.style.display = 'flex';
      } else if (!document.hidden && shield) {
        shield.style.display = 'none';
      }
    });

    // Block Context Menu (Right Click) for restricted users
    document.addEventListener('contextmenu', function(e) {
      if (window.isTextilesSecurityProtected) {
        e.preventDefault();
        return false;
      }
    }, true);

    // Block PrintScreen, Ctrl+P, Ctrl+S, F12, DevTools shortcuts for restricted users
    window.addEventListener('keydown', function(e) {
      if (!window.isTextilesSecurityProtected) return;

      var isCtrl = e.ctrlKey || e.metaKey;
      var isShift = e.shiftKey;
      var key = e.key;
      var code = e.keyCode || e.which;

      // PrintScreen key
      if (key === 'PrintScreen' || code === 44) {
        e.preventDefault();
        e.stopPropagation();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(''); // Clear clipboard immediately
        }
        try {
          fetch('/api/security/log-event', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              eventType: 'SCREENSHOT_ATTEMPT',
              details: 'Web PrintScreen shortcut intercepted & clipboard wiped',
              platform: 'web',
              severity: 'CRITICAL'
            })
          });
        } catch (_) {}
        return false;
      }

      // Ctrl + P (Print page/PDF)
      if (isCtrl && (key === 'p' || key === 'P' || code === 80)) {
        e.preventDefault();
        e.stopPropagation();
        try {
          fetch('/api/security/log-event', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              eventType: 'UNAUTHORIZED_PRINT',
              details: 'Web Ctrl+P print attempt intercepted',
              platform: 'web',
              severity: 'WARNING'
            })
          });
        } catch (_) {}
        return false;
      }

      // Ctrl + S (Save webpage)
      if (isCtrl && (key === 's' || key === 'S' || code === 83)) {
        e.preventDefault();
        e.stopPropagation();
        try {
          fetch('/api/security/log-event', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              eventType: 'UNAUTHORIZED_SAVE',
              details: 'Web Ctrl+S save attempt intercepted',
              platform: 'web',
              severity: 'WARNING'
            })
          });
        } catch (_) {}
        return false;
      }

      // F12 or Ctrl+Shift+I / J / C (DevTools / Inspect)
      if (key === 'F12' || code === 123 ||
          (isCtrl && isShift && (key === 'I' || key === 'i' || key === 'J' || key === 'j' || key === 'C' || key === 'c' || code === 73 || code === 74 || code === 67)) ||
          (isCtrl && (key === 'u' || key === 'U' || code === 85))) {
        e.preventDefault();
        e.stopPropagation();
        try {
          fetch('/api/security/log-event', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              eventType: 'DEVTOOLS_ATTEMPT',
              details: 'Developer Tools / Inspect shortcut intercepted',
              platform: 'web',
              severity: 'CRITICAL'
            })
          });
        } catch (_) {}
        return false;
      }
    }, true);

    // Wipe clipboard on PrintScreen keyup if protected
    window.addEventListener('keyup', function(e) {
      if (window.isTextilesSecurityProtected && (e.key === 'PrintScreen' || e.keyCode === 44)) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText('');
        }
      }
    });
  </script>

  <script>
    var flutterBootScript = document.createElement('script');
    flutterBootScript.src = "flutter_bootstrap.js?v=" + new Date().getTime();
